version: '3.9'

services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: finai-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./bot:/app
      - bot_data:/app/data

  api:
    build:
      context: ./bot
      dockerfile: Dockerfile.api
    container_name: finai-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    container_name: finai-miniapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env

  db:
    image: postgres:16-alpine
    container_name: finai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finai
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bot/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  bot_data:
